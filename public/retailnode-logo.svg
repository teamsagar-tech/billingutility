<svg width="380" height="100" viewBox="0 0 380 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Badge -->
  <g id="rn-badge">
    <!-- Main circle -->
    <circle cx="50" cy="50" r="41" fill="#ffffff" stroke="#0ea5e9" stroke-width="7" />
    
    <!-- Left connection node -->
    <circle cx="9" cy="50" r="4.5" fill="#ffffff" stroke="#0ea5e9" stroke-width="3" />
    
    <!-- Right connection node -->
    <circle cx="91" cy="50" r="4.5" fill="#ffffff" stroke="#0ea5e9" stroke-width="3" />
    
    <!-- RN. Monogram -->
    <text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-family="'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5px">
      <tspan fill="#0f172a">RN</tspan><tspan fill="#0ea5e9">.</tspan>
    </text>
  </g>
  
  <!-- RetailNode Brand Name -->
  <text x="114" y="54" dominant-baseline="central" font-family="'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" letter-spacing="-1.2px">
    <tspan fill="#0f172a">Retail</tspan><tspan fill="#2563eb">Node</tspan>
  </text>
</svg>
