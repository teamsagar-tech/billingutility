<script>
    document.getElementById('homeTab').addEventListener('click', function(e) {
        e.preventDefault(); // Prevent the default link behavior
        location.reload(); // Reload the page
    });

    // Global variables to track pagination state
    let lastBillDate = null;
    let hasMoreBills = true;
    let isLoading = false;

    $(document).ready(function() {
        loadUserBills();
    });

    function loadUserBills() {
        $.ajax({
            url: '/api/filter-list',
            type: 'POST',
            data: {
                mode: 'fetch',
                auth_token: AUTH_TOKEN,
                // 'BfBills[id]': 0,
                // bill_id: 0
            },
            success: function(response) {
                $('#loader').hide();
                response = JSON.parse(response);
                if (response.status) {
                    $('#listing').html(response.data);
                    // Extract lastBillDate from response if available
                    if (response.lastBillDate) {
                        lastBillDate = response.lastBillDate;
                    } else {
                        hasMoreBills = false;
                    }
                } else {
                    $('#listing').html(response.message);
                    hasMoreBills = false;
                }
            },
            error: function(xhr, status, error) {
                console.log(error);
            },
            complete: function() {
                $('#loader').hide();
            }
        });
    }

    function SendReviewLink(elem) {
        let custPhone = $('#cust_phone').val();
        let dialCode = $('#dial_code-1').val();

        if (custPhone.length < 8) {
            alert('Please enter a valid phone number');
            return;
        }

        $(elem).html('sending...');
        $(elem).prop('disabled', true);

        $.ajax({
            url: '/api/send-intro',
            type: 'POST',
            data: {
                cust_phone: custPhone,
                dial_code: dialCode,
                auth_token: AUTH_TOKEN
            },
            success: function(response) {
                response = JSON.parse(response);
                if (!response.error) {
                    alert('Review Link Sent to ' + custPhone);
                }
            },
            error: function(xhr, status, error) {
                console.log(error);
            },
            complete: function() {
                $(elem).html('Send Review Link');
                $(elem).prop('disabled', false);
            }
        });
    }

    $('body').on('scroll', function() {
        let scrollTop = $(this).scrollTop();
        let windowHeight = $(this).innerHeight();
        let docHeight = $(this)[0].scrollHeight;
        if (!isLoading && hasMoreBills && scrollTop + windowHeight >= docHeight - 200) {
            isLoading = true;
            loadMoreBills();
        }
    });


    function loadMoreBills() {
        $('#p-loader').removeClass('d-none');
        if (!lastBillDate || !hasMoreBills) {
            console.log("No more bills to load");
            $('#p-loader').addClass('d-none');
            isLoading = false;
            return;
        }

        $.ajax({
            url: '/api/filter-list',
            method: 'POST',
            data: {
                mode: 'fetch',
                auth_token: AUTH_TOKEN,
                lastBillDate: lastBillDate
            },
            success: function(response) {
                response = JSON.parse(response);
                if (response.status) {
                    $('#p-loader').addClass('d-none');
                    const newData = response.data;

                    // Check if we received any new bills
                    if (!newData || newData.trim() === '' || newData.includes('No Bill found')) {
                        hasMoreBills = false;
                        return;
                    }
                    $('#listing').append(newData);

                    // Update lastBillDate for next pagination
                    if (response.lastBillDate) {
                        lastBillDate = response.lastBillDate;
                    } else {
                        // No lastBillDate means we've reached the end
                        hasMoreBills = false;
                    }

                    // Additional check: if we got less than expected results, likely end of data
                    // const billElements = $(newData).find('.bill-item, .list-group-item, [data-bill]');
                    // if (billElements.length < 20) { 
                    //     hasMoreBills = false;
                    // }

                } else {
                    // No more bills found
                    hasMoreBills = false;
                    $('#p-loader').addClass('d-none');
                }
            },
            error: function(xhr, status, error) {
                console.log(error);
            },
            complete: function() {
                $('#p-loader').addClass('d-none');
                isLoading = false;
            }
        });

    }
</script>

<script type="text/javascript">
    $(document).ready(function() {
        $('#fetchmybills').click(function() {
            $('#listing').html('<center><span class="loader" id="loader"></span>Filtering your bills...</center>');
            filterBills();
        });
    });

    function filterBills() {
        var catFilter = Array.from(document.getElementById('categoryFilter').selectedOptions, option => option.value);
        var merchFilter = Array.from(document.getElementById('merchantFilter').selectedOptions, option => option.value);
        var dataToFilter = {
            start_date: $('#startDate').val(),
            end_date: $('#endDate').val(),
            categories: catFilter,
            merchants: merchFilter,
            amount: $('#billAmount').val(),
            auth_token: AUTH_TOKEN,
            mode: 'fetch',
            // 'BfBills[id]': 0,
            // bill_id: 0,
        }
        $.ajax({
            url: '/api/filter-list',
            type: 'POST',
            data: dataToFilter,

            success: function(response) {
                $('#loader').hide();
                response = JSON.parse(response);
                if (response.status) {
                    $('#listing').html(response.data);
                    $('body').css('overflow', 'hidden');
                    $('#listing').css('height', '86vh').css('padding-bottom', '1rem').css('overflow-y', 'auto');
                } else {
                    $('#listing').html(response.message);
                }
            },
            error: function(xhr, status, error) {
                console.log(error);
            },
            complete: function() {
                $('#loader').hide(); // Hide the loader after the AJAX request completes
            }
        });
    }
